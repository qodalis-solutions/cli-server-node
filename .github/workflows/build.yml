name: Build & Test

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

jobs:
  build:
    runs-on: ubuntu-latest
    # PostgreSQL for the users-postgres store tests (QCLI_TEST_POSTGRES)
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qcli_test
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build abstractions
        run: cd packages/abstractions && npx tsc

      - name: Install plugin dependencies
        run: |
          for plugin in data-explorer-sql data-explorer-mongo data-explorer-postgres data-explorer-mysql data-explorer-mssql data-explorer-redis data-explorer-elasticsearch; do
            cd plugins/$plugin && npm install --omit=dev && cd ../..
          done
          cd plugins/admin && npm install && cd ../..
          cd plugins/aws && npm install && cd ../..

      - name: Hoist plugin runtime deps for test resolution
        run: |
          for plugin in data-explorer-sql data-explorer-mongo data-explorer-postgres data-explorer-mysql data-explorer-mssql data-explorer-redis data-explorer-elasticsearch; do
            if [ -d "plugins/$plugin/node_modules" ]; then
              cp -rn plugins/$plugin/node_modules/* node_modules/ 2>/dev/null || true
              rm -rf plugins/$plugin/node_modules
            fi
          done

      - name: Build plugins
        run: |
          cd plugins/migrations && npx tsc
          cd ../filesystem && npx tsc
          cd ../weather && npx tsc
          cd ../filesystem-json && npx tsc
          cd ../filesystem-sqlite && npx tsc
          cd ../filesystem-s3 && npx tsc
          cd ../jobs && npx tsc
          cd ../audit && npx tsc
          cd ../users && npx tsc
          cd ../users-postgres && npx tsc
          cd ../public-api && npx tsc
          cd ../docs && npx tsc
          cd ../data-explorer && npx tsc
          cd ../data-explorer-sql && npx tsc
          cd ../data-explorer-mongo && npx tsc
          cd ../data-explorer-postgres && npx tsc
          cd ../data-explorer-mysql && npx tsc
          cd ../data-explorer-mssql && npx tsc
          cd ../data-explorer-redis && npx tsc
          cd ../data-explorer-elasticsearch && npx tsc
          cd ../admin && npx tsc
          cd ../portal && npm install && npx tsc
          cd ../aws && npx tsc

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
        env:
          QCLI_TEST_POSTGRES: postgres://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/qcli_test
